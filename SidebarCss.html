<style>
  :root {
    --ink: #1f2a3a;
    --muted: #62708a;
    --line: #d8e0eb;
    --soft: #f4f7fb;
    --accent: #147c72;
    --accent-dark: #0f665e;
    --warn: #9a5a00;
    --danger: #b42318;
    --ok: #12743a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    color: var(--ink);
    background: #fff;
    font: 14px/1.4 Arial, sans-serif;
  }

  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 28px 18px;
    background: #fff;
    border-bottom: 4px solid #223047;
  }

  .eyebrow {
    color: var(--accent-dark);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  h1 {
    margin: 4px 0 0;
    font-size: 26px;
    letter-spacing: 0;
  }

  h2 {
    margin: 0 0 10px;
    font-size: 20px;
  }

  .toolbar {
    display: grid;
    grid-template-columns: 150px 110px repeat(4, minmax(120px, 1fr));
    gap: 10px;
    padding: 16px 28px;
    background: var(--soft);
    border-bottom: 1px solid var(--line);
  }

  label {
    display: flex;
    flex-direction: column;
    gap: 5px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  input,
  select,
  textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 12px;
    color: var(--ink);
    background: #fff;
    font: 15px Arial, sans-serif;
    text-transform: none;
  }

  .btn {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 13px;
    color: var(--ink);
    background: #fff;
    font-weight: 800;
    cursor: pointer;
  }

  .btn:hover { border-color: var(--accent); }
  .btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-dark); }
  .btn.danger { color: var(--danger); }
  .btn.wide { margin-top: 16px; width: 100%; }
  .btn:disabled { opacity: .55; cursor: wait; }

  .summary {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    padding: 14px 28px;
    border-bottom: 1px solid var(--line);
  }

  .metric {
    padding: 9px 13px;
    border-radius: 999px;
    background: #f8fafc;
    color: var(--muted);
    font-weight: 800;
  }

  .metric strong {
    margin-right: 6px;
    color: var(--ink);
  }

  .warnings {
    margin: 14px 28px;
    padding: 12px 14px;
    border: 1px solid #f5bd66;
    border-radius: 8px;
    color: #754000;
    background: #fff8eb;
  }

  .tabs {
    display: flex;
    gap: 8px;
    padding: 10px 28px;
    background: #eef3f9;
  }

  .tab {
    flex: 1;
    border: 0;
    border-radius: 8px;
    padding: 11px;
    background: transparent;
    color: var(--muted);
    font-weight: 900;
    cursor: pointer;
  }

  .tab.active {
    color: var(--ink);
    background: #fff;
    box-shadow: 0 1px 5px rgba(24, 36, 56, .1);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  #reviewTab.active {
    display: grid;
    grid-template-columns: 360px minmax(0, 1fr);
    min-height: 520px;
  }

  .queue-pane {
    border-right: 1px solid var(--line);
    background: #f8fafc;
    padding: 16px;
    overflow: auto;
    max-height: calc(100vh - 230px);
  }

  .search { margin-bottom: 12px; }

  .chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .chip {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 12px;
    background: #fff;
    color: var(--muted);
    font-weight: 800;
    cursor: pointer;
  }

  .chip.active {
    color: #fff;
    border-color: var(--accent);
    background: var(--accent);
  }

  .queue-list {
    display: grid;
    gap: 10px;
  }

  .queue-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 13px;
    background: #fff;
    cursor: pointer;
  }

  .queue-card.selected {
    border-color: var(--accent);
    background: #f0faf8;
  }

  .card-row,
  .button-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .queue-name {
    font-size: 16px;
    font-weight: 900;
  }

  .meta {
    margin-top: 4px;
    color: var(--muted);
  }

  .badge {
    border-radius: 999px;
    padding: 6px 10px;
    background: #edf2f7;
    color: var(--ink);
    font-size: 12px;
    font-weight: 900;
    white-space: nowrap;
  }

  .badge.ok { color: var(--ok); background: #e8f6ef; }
  .badge.warn { color: var(--warn); background: #fff3df; }
  .badge.error { color: var(--danger); background: #ffeceb; }

  .detail-panel {
    padding: 20px 28px 34px;
    overflow: auto;
    max-height: calc(100vh - 230px);
  }

  .detail-panel.empty {
    color: var(--muted);
    display: grid;
    place-items: center;
    min-height: 360px;
    text-align: center;
  }

  .section {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin: 14px 0;
    background: #fff;
  }

  .section.highlight {
    border-color: #9dd7cf;
    background: #f0faf8;
  }

  .candidate {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    margin-top: 8px;
  }

  .preview {
    display: grid;
    place-items: center;
    min-height: 220px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    background: #f8fafc;
    overflow: hidden;
  }

  .preview img {
    max-width: 100%;
    max-height: 320px;
    object-fit: contain;
  }

  .settings-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 20px 28px;
  }

  .settings-grid .check {
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    color: var(--ink);
    font-size: 14px;
    text-transform: none;
  }

  .settings-grid .check input {
    width: auto;
  }

  .token-box {
    grid-column: 1 / -1;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    background: #f8fafc;
  }

  .help {
    padding: 24px 28px;
    max-width: 820px;
  }

  .busy {
    width: 28px;
    height: 28px;
  }

  .spinner {
    display: block;
    width: 22px;
    height: 22px;
    border: 3px solid #d8e0eb;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 9;
    max-width: 360px;
    border-radius: 8px;
    padding: 12px 14px;
    color: #fff;
    background: var(--ink);
    box-shadow: 0 12px 30px rgba(24, 36, 56, .22);
    font-weight: 800;
  }

  .toast.error { background: var(--danger); }
  .toast.success { background: var(--ok); }
  .hidden { display: none !important; }

  @media (max-width: 820px) {
    .toolbar { grid-template-columns: 1fr 110px; }
    .toolbar .btn { grid-column: span 2; }
    #reviewTab.active { grid-template-columns: 1fr; }
    .queue-pane { max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
    .detail-panel { max-height: none; }
    .settings-grid { grid-template-columns: 1fr; }
  }
</style>
